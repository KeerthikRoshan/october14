<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1e1822"/>
      <stop offset="100%" stop-color="#0c0a0e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect x="20" y="20" width="560" height="760" rx="32" fill="none" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="8 8"/>
  <circle cx="300" cy="340" r="80" fill="#f43f5e" fill-opacity="0.1" filter="url(#glow)"/>
  <text x="300" y="355" font-family="-apple-system, sans-serif" font-size="48" text-anchor="middle" fill="#f43f5e">📸</text>
  <text x="300" y="470" font-family="'Playfair Display', serif" font-size="28" font-weight="600" text-anchor="middle" fill="#fce7f3">AI CONCEPT PHOTO #1</text>
  <text x="300" y="510" font-family="monospace" font-size="14" text-anchor="middle" fill="#a1a1aa">Photo we haven't taken yet</text>
  <text x="300" y="550" font-family="monospace" font-size="12" text-anchor="middle" fill="#fb7185">Drop your photo here</text>
</svg>
